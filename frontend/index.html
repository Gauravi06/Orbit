<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — Adaptive Student Planner</title>

    <!-- Google Fonts: Fraunces (Display), Instrument Sans (Body/UI), JetBrains Mono (Data/Times) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme flash prevention: evaluates and applies mode & palette before first paint -->
    <script>
      (function () {
        try {
          var mode = 'light';
          var palette = 'terracotta';

          // Migrate old theme storage or read new theme storage
          var saved = localStorage.getItem('orbit_theme');
          if (saved === 'paper') {
            mode = 'light';
            palette = 'terracotta';
          } else if (saved === 'ink') {
            mode = 'dark';
            palette = 'terracotta';
          } else if (saved) {
            try {
              var parsed = JSON.parse(saved);
              if (parsed && typeof parsed === 'object') {
                if (parsed.mode === 'light' || parsed.mode === 'dark') mode = parsed.mode;
                if (['terracotta', 'sage', 'dusk', 'plum'].indexOf(parsed.palette) !== -1) palette = parsed.palette;
              }
            } catch (e) {
              /* ignore parse error */
            }
          } else {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            mode = prefersDark ? 'dark' : 'light';
          }

          document.documentElement.setAttribute('data-mode', mode);
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'light');
          document.documentElement.setAttribute('data-palette', 'terracotta');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
